#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      l_min: 30
      n_ell: 3000
      binsize: 100
      emulator: False
      cmb_primaries: True
      z_max: 6
      n_chi: 1024
      
      # data and noise
      lens_data_path: data/Prat_lens_data.npy
      source_data_path: data/Prat_source_data.npy
      shot_noise_path: data/Prat_shot_noise.npy
      shape_noise_path: data/Prat_shape_noise.npy
      cmb_noise_kk_path: data/Prat_cmb_noise_kk.npy
      cmb_noise_TT_path: data/Prat_cmb_noise_TT.npy
      cmb_noise_TE_path: data/Prat_cmb_noise_TE.npy
      cmb_noise_EE_path: data/Prat_cmb_noise_EE.npy

      data_vector_path: cobaya_data/Prat_data_vector.npy
      covariance_path: cobaya_data/Prat_covariance_matrix.npy

      #magnification_bias_lenses: None
      desired_spectra: [CG, GL, EE, TT, TE]

      fiducial_cosmology_params:
        Omega_c: 0.2589
        Omega_b: 0.04859
        h: 0.6774
        A_s: 2.141e-9
        n_s: 0.9667
        w0: -1
        wa: 0
        Omega_k: 0.0
        Neff: 3.044
        m_nu: 0.06
        T_CMB: 2.7255

# parameters
params:

  'Omega_b':
    prior:
         min: 0.01
         max: 0.07
    ref: 
        dist: uniform
        min: 0.048
        max: 0.049
    proposal: 0.0001
    latex: "\\Omega_m"

  'w0':
    prior:
         min: -1.5
         max: -0.5
    ref: 
        dist: uniform
        min: -1.1
        max: -0.9
    proposal: 0.05
    latex: "w_0"

  'Omega_k':
    prior:
         min: -0.1
         max: 0.1
    ref: 
        dist: uniform
        min: -0.02
        max: 0.02
    proposal: 0.005
    latex: "\\Omega_k"

  'h':
    prior:
         min: 0.45
         max: 0.85
    ref:
        dist: uniform
        min: 0.645
        max: 0.695
    proposal: 0.01
    latex: "h"
    
  wa: 0

  A_s: 2.141e-9
  
  Omega_c: 0.2589

  n_s: 0.9667

  Neff: 3.044
  
  m_nu: 0.06
  
  T_CMB: 2.7255

# sampler settingsF
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_samples: 50000
    proposal_scale: 1.5
    seed: 1237

# theory
theory: {}

# result
output: chains/Prat_likelihood