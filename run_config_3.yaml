#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      l_min: 30
      n_ell: 5000
      binsize: 50
      emulator: False
      cmb_primaries: True
      z_max: 6
      n_chi: 1024
      
      # data and noise
      lens_data_path: data/DESI_lens_data_bin1.npy
      source_data_path: data/HSC_dist_0_3_bin1.npy

      shot_noise_path: data/DESI_shot_noise_bin1.npy
      shape_noise_path: data/DESI_shape_noise_bin1.npy
      cmb_noise_kk_path: data/SO_cmb_noise_kk.npy
      cmb_noise_TT_path: data/SO_cmb_noise_TT.npy
      cmb_noise_TE_path: data/SO_cmb_noise_TE.npy
      cmb_noise_EE_path: data/SO_cmb_noise_EE.npy

      data_vector_path: cobaya_data/flat_LCDM_bin1_LRP_data_vector.npy
      covariance_path: cobaya_data/flat_LCDM_bin1_LRP_covariance_matrix.npy

      magnification_bias_lenses: 0.8
      desired_spectra: [CG, GL, EE, TT, TE]

      fiducial_cosmology_params:
        Omega_c: 0.27
        Omega_b: 0.045
        h: 0.674
        A_s: 2.105e-9
        n_s: 0.96
        w0: -1.0
        wa: 0.0
        Omega_k: 0.0
        Neff: 3.044 
        m_nu: 0.06
        T_CMB: 2.7255

# parameters
params:

  'Omega_c':
    prior:
         min: 0.15
         max: 0.35
    ref: 
        dist: uniform
        min: 0.22
        max: 0.3
    proposal: 0.0001
    latex: "\\Omega_c"

  'Omega_b':
    prior:
         min: 0.01
         max: 0.1
    ref: 
        dist: uniform
        min: 0.03
        max: 0.06
    proposal: 0.0001
    latex: "\\Omega_b"

  A_s: 2.105e-9

  h: 0.674

  n_s: 0.96

  w0: -1.0

  wa: 0.0

  Omega_k: 0.0

  Neff: 3.044 
  
  m_nu: 0.06
  
  T_CMB: 2.7255

# sampler settings
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_samples: 20000
    proposal_scale: 1.5
    seed: 1237

# theory
theory: {}

# result
output: chains/flat_LCDM_bin1_LRP_omega_b_omega_c_likelihood