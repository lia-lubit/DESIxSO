#Cobaya!

likelihood:
  original_functions_and_classes.SO_x_DESI_Likelihood:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      n_ell: 3000
      binsize: 50

      # data
      lens_data_path: data/DESI_lens_data_bin1.npy
      source_data_path: data/HSC_dist_0_3_bin1.npy

      shot_noise_lens_path: data/DESI_shot_noise_bin1.npy
      cmb_noise_phi_path: data/SO_CMB_noise.npy
      shape_noise_lens_path: data/DESI_shape_noise_bin1.npy

      data_vector_path: cobaya_data/original_single_bin_data_vector.npy
      covariance_path: cobaya_data/original_single_bin_covariance_matrix.npy

      magnification_bias_lenses: 0.8
      desired_spectra: [GG, LL, GL, CC, CL, CG]

      fiducial_cosmology_params:
        Omega_c: 0.27
        Omega_b: 0.045
        h: 0.674
        sigma8: 0.8
        n_s: 0.96
        w0: -1.0
        wa: 0.0
        Omega_k: 0.0

# parameters
params:

  Omega_m:
    prior:
      dist: norm
      loc: 0.316
      scale: 0.025
    ref: 0.316
    proposal: 0.01
    latex: "\\Omega_m"

  # 'Omega_m': 0.3, # fixed

  # 'sigma8':
  #   prior:
  #     dist: norm
  #     loc: 0.8
  #     scale: 0.05
  #   ref: 0.8
  #   proposal: 0.01
  #   latex: "\\sigma_8"

  sigma8: 0.8

  # 'h':
  #   prior:
  #     dist: norm
  #     loc: 0.67
  #     scale: 0.03
  #   ref: 0.67
  #   proposal: 0.005
  #   latex: "h"

  h: 0.674

  # 'Omega_b':
  #   prior:
  #     dist: norm
  #     loc: 0.045
  #     scale: 0.005
  #   ref: 0.045
  #   proposal: 0.001
  #   latex: "\\Omega_b"

  Omega_b: 0.045

  # 'n_s':
  #   prior:
  #     dist: norm
  #     loc: 0.96
  #     scale: 0.02
  #   ref: 0.96
  #   proposal: 0.005
  #   latex: "n_s"

  n_s: 0.96

  # 'w0':
  #   prior:
  #     dist: norm
  #     loc: -1.0
  #     scale: 0.1
  #   ref: -1.0
  #   proposal: 0.01
  #   latex: "w_0"

  w0: -1.0

  # 'wa':
  #   prior:
  #     dist: norm
  #     loc: 0.0
  #     scale: 0.1
  #   ref: 0.0
  #   proposal: 0.05
  #   latex: "w_a"

  wa: 0.0

  # 'Omega_k':
  #   prior:
  #     dist: norm
  #     loc: 0.0
  #     scale: 0.001
  #   ref: 0.0
  #   proposal: 0.001
  #   latex: "\\Omega_k"

  Omega_k: 0.0

# sampler settingsF
sampler:
  minimize: 
    method: bobyqa
    ignore_prior: False
    max_evals: 1e6d
    best_of: 2
    confidence_for_unbounded: 0.9999995  # 5 sigmas of the prior
    seed:  1234
    covmat:

# theory
theory: {}

# result
output: output_minimizer/original_likelihood_min