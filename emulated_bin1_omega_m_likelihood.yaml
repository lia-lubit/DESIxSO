#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood_w_emulator:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      n_ell: 3000
      binsize: 50
      
      # data
      lens_data_path: data/DESI_lens_data_bin1.npy
      source_data_path: data/HSC_dist_0_3_bin1.npy

      shot_noise_lens_path: data/DESI_shot_noise_bin1.npy
      cmb_noise_phi_path: data/SO_CMB_noise.npy
      shape_noise_lens_path: data/DESI_shape_noise_bin1.npy

      data_vector_path: cobaya_data/single_bin_data_vector.npy
      covariance_path: cobaya_data/single_bin_covariance_matrix.npy

      magnification_bias_lenses: 0.8
      desired_spectra: [GG, LL, GL, CC, CL, CG]

      fiducial_cosmology_params:
        Omega_c: 0.27
        Omega_b: 0.045
        h: 0.674
        A_s: 2.105e-9
        n_s: 0.96
        w0: -1.0
        wa: 0.0
        Omega_k: 0.0

# parameters
params:

  Omega_m:
    prior:
        dist: norm
        loc: 0.316
        scale: 0.025
    ref:
        dist: norm
        loc: 0.316
        scale: 0.01
    proposal: 0.001
    latex: "\\Omega_m"

