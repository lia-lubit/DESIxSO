#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      n_ell: 3000
      binsize: 50
      emulator: False
      cmb_primaries: True
      z_max: 6
      n_chi: 1024
      
      # data and noise
      lens_data_path: data/Pratt_lens_data.npy
      source_data_path: data/Pratt_source_data.npy
      shot_noise_path: data/Pratt_shot_noise.npy
      shape_noise_path: data/Pratt_shape_noise.npy
      cmb_noise_kk_path: data/medium_l_SO_cmb_noise_kk.npy
      cmb_noise_TT_path: data/medium_l_SO_cmb_noise_TT.npy
      cmb_noise_TE_path: data/medium_l_SO_cmb_noise_TE.npy
      cmb_noise_EE_path: data/medium_l_SO_cmb_noise_EE.npy

      data_vector_path: cobaya_data/Pratt_data_vector.npy
      covariance_path: cobaya_data/Pratt_covariance_matrix.npy

      #magnification_bias_lenses: None
      desired_spectra: [GL, CG, TT, TE, EE]

      fiducial_cosmology_params:
        Omega_c: 0.2589
        Omega_b: 0.04859
        h: 0.6774
        A_s: 2.141e-9
        n_s: 0.9667
        w0: -1
        wa: 0
        Omega_k: 0.0

# parameters
params:

  'Omega_m':
    prior:
         min: 0.1
         max: 0.7
    ref: 
        dist: uniform
        min: 0.295
        max: 0.335
    proposal: 0.005
    latex: "\\Omega_m"

  'w0':
    prior:
         min: -2
         max: 0.5
    ref: 
        dist: uniform
        min: -1.2
        max: -0.8
    proposal: 0.05
    latex: "w_0"

  'Omega_k':
    prior:
         min: -0.3
         max: 0.3
    ref: 
        dist: uniform
        min: -0.1
        max: 0.1
    proposal: 0.005
    latex: "\\Omega_k"
    
  wa: 0

  A_s: 2.141e-9
  
  h: 0.6774

  Omega_b: 0.04589

  n_s: 0.9667

# sampler settingsF
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_samples: 50000
    proposal_scale: 1.5
    seed: 1234

# theory
theory: {}

# result
output: chains/Pratt_likelihood