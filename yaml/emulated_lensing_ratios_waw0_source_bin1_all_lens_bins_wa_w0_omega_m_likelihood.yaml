#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood_w_emulator:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      n_ell: 5000
      binsize: 50
      
      # data
      lens_data_path: data/DESI_lens_data.npy
      source_data_path: data/HSC_dist_0_3_bin1.npy

      shot_noise_path: data/DESI_shot_noise.npy
      cmb_noise_phi_path: data/SO_CMB_noise.npy
      shape_noise_path: data/DESI_shape_noise_bin1.npy

      data_vector_path: cobaya_data/emulated_lensing_ratios_waw0_source_bin1_all_lens_bins_data_vector.npy
      covariance_path: cobaya_data/emulated_lensing_ratios_waw0_source_bin1_all_lens_bins_covariance_matrix.npy

      magnification_bias_lenses: 0.8
      desired_spectra: [GL, CG]

      fiducial_cosmology_params:
        Omega_c: 0.265
        Omega_b: 0.0508
        h: 0.6674
        A_s: 2.1006e-9
        n_s: 0.966
        w0: -0.752
        wa: -0.86
        Omega_k: 0.0

# parameters
params:

  'Omega_m':
    prior:
         min: 0.2
         max: 0.4
    ref: 
        dist: uniform
        min: 0.295
        max: 0.335
    proposal: 0.01
    latex: "\\Omega_m"

  'wa':
    prior:
         min: -3
         max: 0.5
    ref: 
        dist: uniform
        min: -1.06
        max: -0.66
    proposal: 0.15
    latex: "w_a"

  'w0':
    prior:
         min: -1.2
         max: -0.2
    ref: 
        dist: uniform
        min: -0.952
        max: -0.552
    proposal: 0.05
    latex: "w_0"

  A_s: 2.1006e-9
  
  h: 0.6674

  Omega_b: 0.0508

  n_s: 0.966

  Omega_k: 0.0

# sampler settingsF
sampler:
  mcmc:
    Rminus1_stop: 0.01
    max_samples: 50000
    proposal_scale: 1.5
    seed: 1234

# theory
theory: {}

# result
output: chains/emulated_lensing_ratios_flat_LCDM_source_bin1_all_lens_bins_wa_w0_omega_m_likelihood