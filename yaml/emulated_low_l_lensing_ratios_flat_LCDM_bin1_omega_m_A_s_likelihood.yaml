#Cobaya!

likelihood:
  functions_and_classes.SO_x_DESI_Likelihood_w_emulator:
    python_path: "likelihoods"

    data_specs:
      f_sky: 0.4
      n_ell: 1500
      binsize: 50
      
      # data
      lens_data_path: data/DESI_lens_data_bin1.npy
      source_data_path: data/HSC_dist_0_3_bin1.npy

      shot_noise_path: data/DESI_shot_noise_bin1.npy
      cmb_noise_kappa_path: data/low_l_SO_CMB_noise.npy
      shape_noise_path: data/DESI_shape_noise_bin1.npy

      data_vector_path: cobaya_data/emulated_low_l_lensing_ratios_flat_LCDM_bin1_data_vector.npy
      covariance_path: cobaya_data/emulated_low_l_lensing_ratios_flat_LCDM_bin1_covariance_matrix.npy

      magnification_bias_lenses: 0.8
      desired_spectra: [GL, CG]

      fiducial_cosmology_params:
        Omega_c: 0.27
        Omega_b: 0.045
        h: 0.674
        A_s: 2.105e-9
        n_s: 0.96
        w0: -1.0
        wa: 0.0
        Omega_k: 0.0

# parameters
params:

  'Omega_m':
    prior:
         min: 0.265
         max: 0.365
    ref: 
        dist: uniform
        min: 0.295
        max: 0.335
    proposal: 0.005
    latex: "\\Omega_m"

  'A_s':
    prior:
      min: 1.605e-9
      max: 2.605e-9
    ref: 
        dist: uniform
        min: 1.905e-9
        max: 2.305e-9
    proposal: 0.05e-9
    latex: "A_s"
  
  # 'h':
  #   prior:
  #     dist: norm
  #     loc: 0.67
  #     scale: 0.03
  #   ref: 0.67
  #   proposal: 0.005
  #   latex: "h"

  h: 0.674

  # 'Omega_b':
  #   prior:
  #     dist: norm
  #     loc: 0.045
  #     scale: 0.005
  #   ref: 0.045
  #   proposal: 0.001
  #   latex: "\\Omega_b"

  Omega_b: 0.045

